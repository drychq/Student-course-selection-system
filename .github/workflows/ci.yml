name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
          - os: ubuntu-latest
            compiler: gcc
          - os: macos-latest
            compiler: gcc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install GCC 15 on Linux
        if: runner.os == 'Linux'
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 15
          platform: x64

      - name: Install GCC 15 on macOS
        if: runner.os == 'macOS'
        run: brew install gcc@15

      - name: Configure GCC
        if: matrix.compiler == 'gcc'
        run: xmake f -y --cc=gcc-15 --cxx=g++-15

      - name: Build and test debug
        run: |
          xmake f -y -m debug
          xmake build -y Student-course-selection-system
          xmake build -y student_course_selection_tests
          xmake run student_course_selection_tests

      - name: Build and test release
        run: |
          xmake f -y -m release
          xmake build -y Student-course-selection-system
          xmake build -y student_course_selection_tests
          xmake run student_course_selection_tests
